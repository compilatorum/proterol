[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proterol"
version = "0.1.0"
description = "PROTEROL — Language of Transformations, Executable Ontology & Semantic Genome for Compilatorum"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "João Nitsche (Sukata)", email = "joaonit@gmail.com" },
    { name = "Compilatorum", email = "joaonit@gmail.com" }
]
keywords = [
    "proterol",
    "ontology",
    "type-theory",
    "category-theory",
    "semiotics",
    "compilatorum",
    "semiurgy",
    "proof-carrying-code",
    "verifiable-credentials",
    "erc-6551",
    "nft",
    "agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
proterol = "proterol.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
